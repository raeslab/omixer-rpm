# Builds every push to a branch and every pull request: unit tests, golden tests and javadoc; also run by
# release.yml for a version tag. The benchmark (gradle benchmark) stays manual: its time limits need the same machine
# for both jars.
name: Build

on:
  push:
    # tags are built by release.yml
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # the wrapper is not in the repository: use the Gradle version of gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Build and test
        run: gradle build javadoc

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

      # the jar that passed the tests, attached to the release by release.yml
      - name: Jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*-all.jar
          retention-days: 7
