plugins {
	id 'com.gradleup.shadow' version '9.6.1'
	id 'groovy'
}

group = "io.omixer"
version = '2.0.0-SNAPSHOT'

// Minimum Java version for users; compiles and runs the tests on this JDK
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// Benchmark gate (src/benchmark): plain Java, not part of the jar
sourceSets {
	benchmark
}

repositories {
	mavenCentral()
	mavenLocal()
}

dependencies {
	implementation 'info.picocli:picocli:4.7.7'
	// commons-logging >= 1.3 delegates to the Log4j 2 API when it is on the classpath
	implementation 'commons-logging:commons-logging:1.4.0'
	implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
	runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'

	implementation 'org.apache.commons:commons-math3:3.6.1'
	implementation 'org.apache.commons:commons-lang3:3.21.0'

	implementation 'io.omixer:omixer-utils:1.2.0'

	// Groovy is only used by the Spock tests; spock-core brings it in
	testImplementation platform('org.spockframework:spock-bom:2.5-groovy-5.0')
	testImplementation 'org.spockframework:spock-core'
	testRuntimeOnly platform('org.junit:junit-bom:5.14.4')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// the golden tests capture log messages with a Log4j appender
	testImplementation 'org.apache.logging.log4j:log4j-core:2.26.1'
}

test {
	useJUnitPlatform {
		excludeTags 'golden'
	}
}

// Golden tests (GoldenSpec): the command line on every case against src/test/resources/golden/expected
tasks.register('goldenTest', Test) {
	description = 'Compares the command line outputs with the recorded golden outputs.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'golden'
	}
	// print which files differ
	testLogging {
		exceptionFormat = 'full'
	}
	shouldRunAfter test
}

tasks.register('goldenRecord', Test) {
	description = 'Rewrites the recorded golden outputs with the current code.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'golden'
	}
	systemProperty 'golden.record', 'true'
	outputs.upToDateWhen { false }
}

tasks.named('check') {
	dependsOn 'goldenTest'
}

jar {
	manifest {
		attributes 'Main-Class': 'io.omixer.rpm.cli.OmixerRpmCommand'
		// read back by the help banner
		attributes 'Implementation-Version': project.version
	}
}

// Benchmark gate: the current jar against a baseline jar on generated inputs (speed, heap, matrices); see REFACTORING.md
tasks.register('benchmark', JavaExec) {
	description = 'Compares the speed, heap and matrices of the current jar with a baseline jar.'
	group = 'verification'
	classpath = sourceSets.benchmark.runtimeClasspath
	mainClass = 'io.omixer.rpm.benchmark.Benchmark'
	def currentJar = tasks.named('shadowJar').flatMap { it.archiveFile }
	def baselineJar = providers.gradleProperty('benchmark.baseline').map { file(it) }
		.orElse(layout.buildDirectory.file('benchmark/omixer-rpm-1.2-all.jar').map { it.asFile })
	def workDir = layout.buildDirectory.dir('benchmark')
	// time limit as a fraction of the baseline time; ~1.10 when the baseline is a 2.0 jar
	def limit = providers.gradleProperty('benchmark.limit').orElse('0.30')
	inputs.file(currentJar)
	argumentProviders.add({ [
		currentJar.get().asFile.path,
		baselineJar.get().path,
		'https://github.com/raeslab/omixer-rpm/releases/download/v1.2.0/omixer-rpm-1.2-all.jar',
		workDir.get().asFile.path,
		file('src/test/resources/golden/inputs/synthetic').path,
		file('src/test/resources/module.list').path,
		limit.get()
	] } as CommandLineArgumentProvider)
	outputs.upToDateWhen { false }
}
